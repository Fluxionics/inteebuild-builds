<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mi Radio</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#0b0f1a;color:#f9fafb;padding:20px 16px 90px}
h1{font-size:22px;margin:6px 0 4px}p{color:#9ca3af;font-size:14px}
.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:16px;margin:12px 0}
.btn{display:inline-block;background:#10b981;color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:700;margin:6px 4px 6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
img{max-width:100%;border-radius:10px}
</style>
<link rel="manifest" href="manifest.webmanifest" /></head>
<body>
<h1>📻 Mi Radio</h1><p>Audio 100% nativo: suena con pantalla apagada. Cambia la URL por tu servidor.</p><div class="card"><input id="s" value="https://example.com/stream.mp3" style="width:100%;padding:10px;border-radius:8px;border:1px solid #1f2937;background:#020617;color:#fff" /><br><br><button class="btn" onclick="nPlay()">▶ Play nativo</button><button class="btn" onclick="nPause()">⏸ Pausa</button><p id="st">Listo</p></div><script>function nPlay(){var u=document.getElementById('s').value;if(window.InteeAudio){try{InteeAudio.play(u);document.getElementById('st').textContent='Sonando en nativo…';}catch(e){fallback(u);}}else fallback(u);}function nPause(){if(window.InteeAudio){try{InteeAudio.pause();}catch(e){}}var a=document.getElementById('p');if(a)a.pause();document.getElementById('st').textContent='En pausa';}function fallback(u){var a=document.getElementById('p');if(!a){a=document.createElement('audio');a.id='p';a.preload='none';document.body.appendChild(a);}a.src=u;a.load();a.play();document.getElementById('st').textContent='Sonando en web (fallback)…';}document.addEventListener('visibilitychange',function(){});</script>
<script>(function(){var CFG={"pullRefresh":false,"offlineScreen":true,"offlineMessage":"Sin conexión. El stream necesita internet.","flagSecure":false,"blockSelection":false,"drawerEnabled":false,"bottomNavEnabled":false,"loadingIndicator":"spinner","rootDetection":false};var DRAWER=[];var BOTTOM=[];if(CFG.blockSelection){var s=document.createElement("style");s.textContent="*{ -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;} input,textarea{ -webkit-user-select:text; user-select:text;}";document.head.appendChild(s);document.addEventListener("contextmenu",e=>e.preventDefault());}if(CFG.loadingIndicator!=="none"){window.addEventListener("beforeunload",()=>{var el=document.createElement("div");el.id="ib-loading";el.style.cssText="position:fixed;top:0;left:0;right:0;height:3px;background:var(--accent,#6366f1);z-index:9999;animation:ibLoad 1s infinite";if(CFG.loadingIndicator==="spinner")el.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:9999";el.innerHTML=CFG.loadingIndicator==="spinner"?"<div style='width:40px;height:40px;border:4px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite'></div>":"";document.body.appendChild(el);});}if(CFG.pullRefresh&&window.Capacitor){document.addEventListener("DOMContentLoaded",()=>{let startY=0;document.addEventListener("touchstart",e=>startY=e.touches[0].clientY,{passive:true});document.addEventListener("touchend",e=>{let dy=e.changedTouches[0].clientY-startY;if(dy>80&&window.scrollY===0) location.reload();},{passive:true});});}if(CFG.offlineScreen){function check(){var off=!navigator.onLine;var el=document.getElementById("ib-offline");if(off){if(!el){el=document.createElement("div");el.id="ib-offline";el.style.cssText="position:fixed;inset:0;background:#111827;color:#fff;display:grid;place-items:center;z-index:9998;text-align:center;padding:20px";el.innerHTML="<div><div style='font-size:48px;margin-bottom:12px'>📡</div><b>Sin conexión</b><p style='color:#9ca3af'>"+CFG.offlineMessage.replace(/"/g,"&quot;")+"</p><button onclick='location.reload()' style='margin-top:12px;padding:8px 16px;background:#6366f1;color:#fff;border:none;border-radius:8px'>Reintentar</button></div>";document.body.appendChild(el);} } else if(el) el.remove();}window.addEventListener("online",check);window.addEventListener("offline",check);document.addEventListener("DOMContentLoaded",check);}if(CFG.drawerEnabled&&DRAWER.length){var btn=document.createElement("button");btn.textContent="☰";btn.style.cssText="position:fixed;top:12px;left:12px;z-index:9997;background:#111827;color:#fff;border:none;width:36px;height:36px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.3)";var drawer=document.createElement("div");drawer.id="ib-drawer";drawer.style.cssText="position:fixed;top:0;left:-280px;width:260px;height:100%;background:#111827;color:#fff;z-index:9998;transition:left .3s;overflow:auto;padding:16px";drawer.innerHTML="<b style='display:block;margin-bottom:12px'>Menú</b>"+DRAWER.map(i=>"<a href='"+i.url+"' style='display:block;padding:10px 8px;color:#fff;text-decoration:none;border-radius:6px;margin-bottom:4px;background:#1f2937'>"+(i.icon?i.icon+" ":"")+i.label+"</a>").join("")+"<button id='ib-drawer-close' style='margin-top:12px;width:100%;padding:8px;background:#374151;color:#fff;border:none;border-radius:6px'>Cerrar</button>";document.addEventListener("DOMContentLoaded",()=>{document.body.appendChild(btn);document.body.appendChild(drawer);btn.onclick=()=>drawer.style.left="0";drawer.querySelector("#ib-drawer-close").onclick=()=>drawer.style.left="-280px";});}if(CFG.bottomNavEnabled&&BOTTOM.length){var bar=document.createElement("div");bar.id="ib-bottom";bar.style.cssText="position:fixed;bottom:0;left:0;right:0;background:#111827;color:#fff;display:flex;justify-content:space-around;padding:6px 0 8px;z-index:9997;border-top:1px solid #1f2937";bar.innerHTML=BOTTOM.map(i=>"<a href='"+i.url+"' style='flex:1;text-align:center;color:#9ca3af;text-decoration:none;font-size:11px'><div style='font-size:18px'>"+(i.icon||"•")+"</div>"+i.label+"</a>").join("");document.addEventListener("DOMContentLoaded",()=>{document.body.appendChild(bar);document.body.style.paddingBottom="60px";});}if(window.Intee){var origLog=console.log;window.addEventListener("error",e=>{try{Intee.track&&Intee.track("js_error",{message:e.message,source:e.filename});}catch{}});} })();</script><script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}</script></body>
</html>
